[package]
name = "dozer"
version = "0.1.0"
edition = "2024"
description = "Shows what uses your RAM and CPU, closes what is safe in one click, and wakes MCP servers only when an agent needs them"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26"
sysinfo = "0.40"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
auto-launch = "0.6"
anyhow = "1"
log = "0.4"
tiny-skia = "0.11"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"
tiny-skia = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
